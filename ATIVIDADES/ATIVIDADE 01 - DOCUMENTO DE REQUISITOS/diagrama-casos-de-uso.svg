<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Diagrama de casos de uso — Sistema SertãoFrut</title>
<desc>Ator Proprietário conectado a cinco casos de uso dentro do sistema, com relação include entre Registrar Produção e Atualizar Estoque</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="160" y="50" width="440" height="410" rx="12" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="180" y="72" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Sistema de controle de produção e estoque</text>

<line x1="95" y1="260" x2="240" y2="100" stroke="#444441" stroke-width="1"/>
<line x1="95" y1="260" x2="240" y2="180" stroke="#444441" stroke-width="1"/>
<line x1="95" y1="260" x2="240" y2="260" stroke="#444441" stroke-width="1"/>
<line x1="95" y1="260" x2="240" y2="340" stroke="#444441" stroke-width="1"/>
<line x1="95" y1="260" x2="240" y2="420" stroke="#444441" stroke-width="1"/>

<circle cx="70" cy="225" r="10" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="70" y1="235" x2="70" y2="270" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="50" y1="245" x2="90" y2="245" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="70" y1="270" x2="55" y2="300" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="70" y1="270" x2="85" y2="300" stroke="#2C2C2A" stroke-width="1.5"/>
<text x="70" y="318" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Gestor</text>

<ellipse cx="380" cy="100" rx="140" ry="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="380" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Cadastrar produto</text>

<ellipse cx="380" cy="180" rx="140" ry="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="380" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Registrar produção</text>

