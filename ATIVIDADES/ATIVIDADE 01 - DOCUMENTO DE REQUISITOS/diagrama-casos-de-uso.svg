<text x="380" y="264" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Atualizar estoque</text>

<ellipse cx="380" cy="340" rx="140" ry="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="380" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Registrar saída de estoque</text>

<ellipse cx="380" cy="420" rx="140" ry="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
