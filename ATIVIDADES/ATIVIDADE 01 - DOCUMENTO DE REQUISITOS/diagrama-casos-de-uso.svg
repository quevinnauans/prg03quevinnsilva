<path d="M520 180 L560 180 L560 260 L520 260" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="566" y="224" font-family="sans-serif" font-size="12" fill="#5F5E5A">&lt;&lt;include&gt;&gt;</text>
